name: Build brand assets

on:
  push:
    paths:
      - 'custom_components/aqshaqar/brand/icon.svg'
      - '.github/workflows/build-brand-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate PNG assets
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          src = Path('custom_components/aqshaqar/brand/icon.svg')
          out = src.parent
          cairosvg.svg2png(url=str(src), write_to=str(out / 'icon.png'), output_width=256, output_height=256)
          cairosvg.svg2png(url=str(src), write_to=str(out / 'icon@2x.png'), output_width=512, output_height=512)
          PY
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/aqshaqar/brand/icon.png custom_components/aqshaqar/brand/icon@2x.png
          git diff --cached --quiet || git commit -m 'Build Aqshaqar brand PNG assets'
          git push
